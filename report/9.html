<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>라면을 끓이는 순서</title>
  <script>
    function addLi() {
      let text = prompt("라면을 끓이는 순서를 입력하라");
      if (text) {
        let ol = document.getElementById("myOl");
        let li = document.createElement("li");
        li.innerHTML = text;
        ol.appendChild(li);
      }
    }
  </script>
</head>
<body>
  <h3>라면을 끓이는 순서</h3>
  <hr>
  <ol id="myOl" type="A" style="background-color: yellowgreen;" onclick="addLi()">
    <li>물을 끓인다.</li>
  </ol>
</body>
</html>
