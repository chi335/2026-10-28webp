<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>visibility 프로퍼티</title>
  <script>
    function toggleAnswers() {
      let spans = document.getElementsByTagName("span");
      for (let i = 0; i < spans.length; i++) {
        if (spans[i].style.visibility === "hidden") {
          spans[i].style.visibility = "visible";
        } else {
          spans[i].style.visibility = "hidden";
        }
      }
    }
  </script>
</head>
<body>
  <h3>다음 빈 곳에 숨은 단어? <button onclick="toggleAnswers()">show/hide</button></h3>
  <hr>
  <ul>
    <li>I (<span style="visibility: hidden;">love</span>) you.</li>
    <li>CSS is Cascading (<span style="visibility: hidden;">Style</span>) Sheet.</li>
    <li>응답하라 (<span style="visibility: hidden;">1988</span>).</li>
  </ul>
</body>
</html>
