<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>transform:rotate</title>
  <script>
    let degree = 0;
    function rotateImg(obj) {
      degree = (degree + 90) % 360;
      obj.style.transform = "rotate(" + degree + "deg)";
    }
  </script>
</head>
<body>
  <h3>클릭하면 90도 회전합니다.</h3>
  <hr>
  <img src="media/spongebob.png" alt="스폰지밥" onclick="rotateImg(this)">
</body>
</html>
