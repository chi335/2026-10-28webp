<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DOM 객체 동적 삽입</title>
  <script>
    function addAnswer(btn, text) {
      let parentDiv = btn.parentElement;
      
      // 이미 정답 <p> 태그가 존재하는지 확인하여 중복 생성 방지
      let existingP = parentDiv.getElementsByTagName("p")[0];
      if (existingP) return;

      let p = document.createElement("p");
      p.innerHTML = text;
      p.onclick = function() {
        // (2) 클릭하면 생성된 정답 삭제
        this.parentElement.removeChild(this);
      };
      
      parentDiv.appendChild(p);
    }
  </script>
</head>
<body>
  <h3>정답의 동적 삽입</h3>
  <hr>
  <div>
    Q. 거울아 거울아 세상에서 누가 제일 예쁘니?
    <button onclick="addAnswer(this, '백설공주')">답보기</button>
  </div>
  <div>
    Q. 죽느냐 사느냐 어떤 것이 문제인가?
    <button onclick="addAnswer(this, '둘다')">답보기</button>
  </div>
</body>
</html>
