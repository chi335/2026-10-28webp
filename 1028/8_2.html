
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CSS 스타일 동적 변경</title>

    <script>
        function change() {
            let span = document.getElementById("mySpan");

            span.style.color = "green"; // 글자색을 초록색으로 변경
            span.style.fontSize = "30px"; // 글자 크기를 30픽셀로 변경
            span.style.display = "block"; // 블록 박스로 변경
            span.style.width = "6em"; // 박스의 폭을 6em으로 설정
            span.style.border = "3px dotted magenta"; // 자홍색 3픽셀 점선 테두리
            span.style.margin = "20px"; // 상하좌우 여백을 20px로 설정
        }
    </script>
</head>

<body>
    <h3>CSS 스타일 동적 변경</h3>
    <hr>

    <p style="color: blue;">
        이것은
        <span id="mySpan" style="color: red;">문장입니다.</span>
    </p>

    <input type="button" value="스타일 변경" onclick="change()">
</body>
</html>
